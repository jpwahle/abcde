[project]
name = "abcde"
version = "0.1.0"
description = "ABCDE - Age-Based Corpus of Demographic Expressions: A library for extracting demographic self-identification and linguistic features from text."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ABCDE Team" }
]
keywords = [
    "nlp",
    "demographics",
    "linguistic-features",
    "text-analysis",
    "emotion-detection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "bokeh>=3.7.3",
    "dask-jobqueue>=0.9.0",
    "dask[distributed]>=2025.3.0",
    "flashtext>=2.7",
    "langdetect>=1.0.9",
    "nltk>=3.9.1",
    "numpy>=2.2.6",
    "openpyxl>=3.1.5",
    "orjson>=3.10.18",
    "pandas>=2.2.3",
    "presidio-analyzer>=2.2.30",
    "psycopg2-binary>=2.9.10",
    "pyarrow>=20.0.0",
    "requests>=2.32.3",
    "spacy>=3.8.7",
    "sqlalchemy>=2.0.43",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.0.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/abcde-project/abcde"
Documentation = "https://github.com/abcde-project/abcde#readme"
Repository = "https://github.com/abcde-project/abcde"
Issues = "https://github.com/abcde-project/abcde/issues"

[project.scripts]
abcde-reddit = "scripts.process_reddit:main"
abcde-tusc = "scripts.process_tusc:main"
abcde-ngrams = "scripts.process_ngrams:main"
abcde-ai-text = "scripts.process_ai_text:main"
abcde-spinner = "scripts.process_spinner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abcde"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/scripts",
    "/lexicons",
    "/tests",
    "/helpers.py",
    "/README.md",
    "/DATASET.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
timeout = 120
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.isort]
known-first-party = ["abcde"]
